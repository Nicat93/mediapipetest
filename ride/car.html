<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pose Driver</title>
  <meta name="description" content="A driving game you steer with an imaginary steering wheel, using MediaPipe body tracking in the browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body data-vehicle="car" class="car">
  <div id="scene"></div>

  <div id="hud" class="hidden">
    <div class="hud-box"><span class="label">Score</span><span id="hud-score">0</span></div>
    <div class="hud-box"><span class="label">Distance</span><span id="hud-dist">0 m</span></div>
    <div class="hud-box"><span class="label">Speed</span><span id="hud-speed">0 km/h</span></div>
    <div class="hud-box"><span class="label">Lives</span><span id="hud-lives"></span></div>
  </div>

  <div id="corner">
    <button id="settings-btn" type="button" title="Settings" aria-label="Settings">⚙</button>
    <button id="view-btn" type="button" title="Switch camera view (V)" aria-label="Switch camera view">FPV</button>
  </div>

  <div id="steer" class="hidden" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <g id="steer-bar">
        <circle cx="60" cy="60" r="48" fill="none" stroke="#2b2d42" stroke-width="11"/>
        <path d="M14 62 H46 M74 62 H106 M60 74 V106" stroke="#2b2d42" stroke-width="9" stroke-linecap="round"/>
        <circle cx="60" cy="62" r="13" fill="#e63946"/>
        <rect x="55" y="7" width="10" height="11" rx="3" fill="#ffd166"/>
        <circle cx="18.4" cy="36" r="9" fill="#e63946"/>
        <circle cx="101.6" cy="36" r="9" fill="#e63946"/>
      </g>
    </svg>
  </div>

  <div id="cam" class="hidden">
    <video id="cam-video" playsinline muted></video>
    <canvas id="cam-canvas"></canvas>
    <div id="cam-badge">Starting…</div>
  </div>

  <div id="big" class="hidden"></div>

  <div id="overlay"><div class="panel" id="panel"></div></div>

  <div id="settings" class="hidden" role="dialog" aria-label="Settings"><div class="panel" id="settings-panel"></div></div>
</body>
</html>
