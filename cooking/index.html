<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little Chef</title>
  <meta name="description" content="A cooking game for small children. Drag food into the pot with a finger, a mouse or a wave of the hand in front of the webcam.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <section id="start" class="screen">
    <div class="logo" aria-hidden="true">🍳</div>
    <h1>Little Chef</h1>
    <p class="tag">Cook yummy food! Put the food in the pot, then stir.</p>
    <div class="start-buttons">
      <button id="play-hands" class="big"><span class="ico" aria-hidden="true">✋</span>Play with hands<small>uses the camera</small></button>
      <button id="play-touch" class="big alt"><span class="ico" aria-hidden="true">👆</span>Play with touch<small>or a mouse</small></button>
    </div>
    <p class="msg" id="start-msg" role="status"></p>
    <p class="fine">
      For grown-ups: the game talks, so turn the sound on. With the camera, your child picks food up by holding a hand
      over it, then moves it to the pot. The video stays on this device. <a href="../">All games</a>
    </p>
  </section>

  <section id="game" class="screen hidden">
    <header>
      <div id="card" aria-label="Recipe"></div>
      <div id="stickers" aria-label="Dishes cooked"></div>
      <div class="tools">
        <button id="btn-sound" class="tool" aria-label="Sound on/off">🔊</button>
        <button id="btn-home" class="tool" aria-label="Back to start">🏠</button>
      </div>
    </header>
    <main id="stage">
      <div id="dish-wrap">
        <div id="dish"><div class="fill"><div class="toppings"></div></div></div>
        <svg id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" pathLength="100"/></svg>
        <div id="done-dish" aria-hidden="true"></div>
        <div id="wave-hint" class="hidden" aria-hidden="true">👋</div>
      </div>
      <button id="btn-next" class="hidden dwell" aria-label="Next recipe">▶</button>
    </main>
    <div id="shelf"></div>
  </section>

  <div id="cam" class="hidden">
    <video id="cam-video" playsinline muted></video>
    <canvas id="cam-canvas"></canvas>
    <div id="cam-badge">✋?</div>
  </div>

  <div id="loading" class="hidden" role="status"><div class="spinner"></div><p id="loading-text">Getting ready…</p></div>
  <div id="fx" aria-hidden="true"></div>
  <div id="cursors" aria-hidden="true"></div>
</body>
</html>
