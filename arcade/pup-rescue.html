<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#4fb8ff" />
    <title>Pup Rescue Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../common/kit.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="pup-theme">
    <!-- start screen, camera picker, loading: ../common (docs/NEW_GAME.md) -->
    <section id="game" class="screen hidden">
      <canvas id="stage"></canvas>
      <div id="hud" class="body-hud">
        <span id="score">0</span>
        <span id="dist">0 m</span>
        <span id="lives"></span>
      </div>
    </section>

    <button id="sound" class="sound-btn" type="button" aria-label="Sound on/off">🔊</button>

    <section id="start" class="screen">
      <h1 id="title">Pup Rescue Run</h1>
      <p class="tag" id="msg">
        Pick your pup! Then <b>step left and right</b> to run around the cones,
        <b class="c-laser">duck down</b> under the bridges and collect the <b class="c-coin">bones</b>.
      </p>
      <div class="pup-pick" role="group" aria-label="Choose your pup">
        <button type="button" data-pup="fire" aria-pressed="true"><canvas aria-hidden="true"></canvas><span>Fire pup</span></button>
        <button type="button" data-pup="police" aria-pressed="false"><canvas aria-hidden="true"></canvas><span>Police pup</span></button>
        <button type="button" data-pup="pilot" aria-pressed="false"><canvas aria-hidden="true"></canvas><span>Pilot pup</span></button>
        <button type="button" data-pup="builder" aria-pressed="false"><canvas aria-hidden="true"></canvas><span>Builder pup</span></button>
        <button type="button" data-pup="water" aria-pressed="false"><canvas aria-hidden="true"></canvas><span>Water pup</span></button>
      </div>
      <div class="start-buttons">
        <button id="play" class="big"><span class="ico" aria-hidden="true">▶️</span><span class="label">Start</span><small>run, pup, run!</small></button>
      </div>
      <p class="msg kit-msg" role="status"></p>
      <details class="grown-ups">
        <summary>For grown-ups</summary>
        <p>Stand 2–3 m from the camera so the whole body is in view. The game is slow and gentle, with infinite lives by default.</p>
        <div class="kit-camera"></div>
        <label class="cam-pick">Lives <select id="lives-pick"><option value="inf">∞ Infinite</option></select></label>
        <nav class="games-nav">
          <a href="neon-dash.html">Neon Dash</a>
          <a href="../">All games</a>
        </nav>
      </details>
    </section>

    <script type="module" src="js/pup-rescue.js"></script>
  </body>
</html>
