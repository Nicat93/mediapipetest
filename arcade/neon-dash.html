<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1020" />
    <title>Neon Dash</title>
    <link rel="stylesheet" href="../common/kit.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="theme-neon">
    <!-- start screen, camera picker, loading: ../common (docs/NEW_GAME.md) -->
    <section id="game" class="screen hidden">
      <canvas id="stage"></canvas>
      <div id="hud" class="body-hud">
        <span id="score">0</span>
        <span id="dist">0 m</span>
        <span id="lives"></span>
      </div>
    </section>

    <button id="sound" class="sound-btn" type="button" aria-label="Sound on/off">🔊</button>

    <section id="start" class="screen">
      <div class="logo" aria-hidden="true">🏃</div>
      <h1 id="title">Neon Dash</h1>
      <p class="tag" id="msg">
        Run with your whole body. <b>Step left/right</b> to switch lanes and dodge the crates,
        <b class="c-laser">squat</b> under the striped gates, and grab the <b class="c-coin">coins</b>. Stand 2–3 m back so you're fully in view.
      </p>
      <div class="start-buttons">
        <button id="play" class="big"><span class="ico" aria-hidden="true">▶️</span><span class="label">Start</span><small>full body</small></button>
      </div>
      <div class="kit-camera"></div>
      <label class="cam-pick">Lives <select id="lives-pick"><option value="3">3</option></select></label>
      <p class="msg kit-msg" role="status"></p>
      <nav class="games-nav">
        <a href="bubble-pop.html">Bubble Pop</a>
        <a href="body-blitz.html">Body Blitz</a>
        <a href="pup-rescue.html">Pup Rescue Run</a>
        <a href="../">All games</a>
      </nav>
    </section>

    <script type="module" src="js/neon-dash.js"></script>
  </body>
</html>
